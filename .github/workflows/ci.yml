name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure local environment file is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be tracked."
            exit 1
          fi

      - name: Ensure example environment file exists
        run: test -f .env.example

      - name: Check tunnel launcher
        run: python3 -B scripts/test_start_tunnel.py

      - name: Check required project documentation
        shell: bash
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/plan-de-travail.md
          test -f SECURITY.md

  rallly-docker-build:
    name: Build Rallly Docker image
    needs: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Rallly image
        uses: docker/build-push-action@v7
        with:
          context: ./rallly
          file: ./rallly/apps/web/Dockerfile
          platforms: linux/amd64
          build-args: |
            SELF_HOSTED=true
          tags: rallly-fork:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=rallly
          cache-to: type=gha,mode=max,scope=rallly
