x-authentik-environment: &authentik-environment
  AUTHENTIK_POSTGRESQL__HOST: authentik_db
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Définir AUTHENTIK_DB_PASSWORD dans .env}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Définir AUTHENTIK_SECRET_KEY dans .env}

services:
  traefik:
    image: traefik:${TRAEFIK_TAG:-v3.7.19}
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:${TRAEFIK_HTTP_PORT:-80}
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --ping=true
    environment:
      RALLLY_HOST: ${RALLLY_HOST:-rallly.localhost}
      AUTHENTIK_HOST: ${AUTHENTIK_HOST:-authentik.localhost}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:${TRAEFIK_HTTP_PORT:-80}"
    volumes:
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      proxy:
        aliases:
          - ${RALLLY_HOST:-rallly.localhost}
          - ${AUTHENTIK_HOST:-authentik.localhost}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rallly_db:
    image: postgres:18-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${RALLLY_DATABASE_PASSWORD:-postgres}
      - POSTGRES_DB=rallly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rallly_backend

  rallly_selfhosted:
    build:
      args:
        - SELF_HOSTED=true
      context: ./rallly
      dockerfile: ./apps/web/Dockerfile
    restart: always
    depends_on:
      traefik:
        condition: service_healthy
      rallly_db:
        condition: service_healthy
      authentik_server:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${RALLLY_DATABASE_PASSWORD:-postgres}@rallly_db/rallly
      - SECRET_PASSWORD=${RALLLY_SECRET:?Définir RALLLY_SECRET dans .env}
      - NEXT_PUBLIC_BASE_URL=${RALLLY_BASE_URL:-http://rallly.localhost}
      - SUPPORT_EMAIL=${RALLLY_SUPPORT_EMAIL:-support@example.com}
      - EMAIL_LOGIN_ENABLED=${EMAIL_LOGIN_ENABLED:-false}
      - REGISTRATION_ENABLED=true
      - OIDC_NAME=${OIDC_NAME:-Authentik}
      - OIDC_DISCOVERY_URL=${AUTHENTIK_BASE_URL:-http://authentik.localhost}/application/o/rallly/.well-known/openid-configuration
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-rallly}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:?Définir OIDC_CLIENT_SECRET dans .env}
    env_file:
      - path: rallly/apps/web/.env
        required: false
    networks:
      - proxy
      - rallly_backend

  authentik_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_DB_NAME:-authentik}
      POSTGRES_USER: ${AUTHENTIK_DB_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Définir AUTHENTIK_DB_PASSWORD dans .env}
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - authentik_backend

  authentik_server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.5}
    command: server
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      authentik_db:
        condition: service_healthy
    environment:
      <<: *authentik-environment
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
    networks:
      - proxy
      - authentik_backend
    healthcheck:
      # Attendre également que le worker ait créé l'application OIDC Rallly.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request

          url = 'http://127.0.0.1:9000/application/o/rallly/.well-known/openid-configuration'
          urllib.request.urlopen(url, timeout=5).read()
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    volumes:
      - authentik-data:/data
      - ./docker/authentik/blueprints:/blueprints/custom:ro

  authentik_worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.5}
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    user: root
    depends_on:
      authentik_db:
        condition: service_healthy
    environment:
      <<: *authentik-environment
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      RALLLY_BASE_URL: ${RALLLY_BASE_URL:-http://rallly.localhost}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-rallly}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Définir OIDC_CLIENT_SECRET dans .env}
    volumes:
      - authentik-data:/data
      - authentik-certs:/certs
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    networks:
      - authentik_backend

networks:
  proxy:
  rallly_backend:
  authentik_backend:

volumes:
  db-data:
    driver: local
  authentik-db-data:
  authentik-data:
  authentik-certs:
